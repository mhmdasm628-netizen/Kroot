<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنصة</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Cairo (for Arabic) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Cairo', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981', // Emerald 500
                            600: '#059669', // Emerald 600
                        },
                        surface: '#F9FAFB'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #F9FAFB;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body class="text-gray-800 flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav id="navbar" class="hidden bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Right: Logo -->
                <div class="flex-shrink-0 flex items-center cursor-pointer" onclick="navigate('userHome')">
                    <i class="fa-solid fa-layer-group text-brand-500 text-2xl ml-2"></i>
                    <span class="font-bold text-xl text-gray-900" id="nav-site-name">المنصة</span>
                </div>
                <!-- Center: Links -->
                <div class="hidden md:flex space-x-8 space-x-reverse">
                    <a href="#" onclick="navigate('userHome')" class="text-gray-600 hover:text-brand-500 px-3 py-2 rounded-md text-sm font-medium transition-colors">الرئيسية</a>
                    <a href="#" onclick="navigate('adminHome')" class="text-gray-600 hover:text-brand-500 px-3 py-2 rounded-md text-sm font-medium transition-colors">لوحة التحكم</a>
                </div>
                <!-- Left: User Info & Logout -->
                <div class="flex items-center gap-4">
                    <div class="hidden sm:flex flex-col text-left text-xs text-gray-500 mr-4">
                        <span id="nav-user-email" class="font-semibold text-gray-700"></span>
                        <span>مستخدم نشط</span>
                    </div>
                    <button onclick="logout()" class="text-gray-400 hover:text-red-500 transition-colors" title="تسجيل الخروج">
                        <i class="fa-solid fa-right-from-bracket text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app-content" class="flex-grow flex flex-col w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Dynamic content injected here -->
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 mt-auto py-6">
        <div class="max-w-7xl mx-auto px-4 text-center text-gray-500 text-sm">
            &copy; 2026 <span id="footer-site-name">المنصة</span> - جميع الحقوق محفوظة
        </div>
    </footer>

    <!-- Global Modal Container -->
    <div id="modal-backdrop" class="fixed inset-0 bg-gray-900 bg-opacity-50 z-50 hidden flex justify-center items-center p-4 backdrop-blur-sm transition-opacity">
        <div id="modal-content" class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden transform scale-95 transition-transform duration-300">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h3 id="modal-title" class="text-lg font-bold text-gray-900">عنوان</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <!-- Modal Body -->
            <div id="modal-body" class="px-6 py-4 max-h-[70vh] overflow-y-auto">
                <!-- Content -->
            </div>
            <!-- Modal Footer -->
            <div id="modal-footer" class="px-6 py-4 border-t border-gray-100 bg-gray-50/50 flex justify-end gap-3">
                <!-- Buttons -->
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Application Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signInWithCustomToken, signInAnonymously, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'minassa-app';
        let firebaseConfig = {};
        if (typeof __firebase_config !== 'undefined') {
            firebaseConfig = JSON.parse(__firebase_config);
        }

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        
        let dbUser = null;
        let currentView = 'login';
        let currentParams = {};

        // --- State Management ---
        const defaultState = {
            settings: {
                siteName: 'المنصة',
                geminiKey: '',
                geminiModel: 'gemini-3.5-flash'
            },
            networks: [
                { id: '1', name: 'راوتر 1', icon: '🌐', notes: 'كروت راوتر مخصصة', denominations: [
                    { price: 5, available: ['CODE-5-001', 'CODE-5-002', 'CODE-5-003'], extracted: [] },
                    { price: 10, available: ['CODE-10-001'], extracted: [] }
                ]}
            ],
            prompts: [
                { id: '1', name: 'كتابة إعلان', icon: '📢', staticPrompt: 'اكتب إعلان تسويقي جذاب عن:', generated: [] }
            ],
            customFeatures: [
                { id: '1', name: 'سجل العملاء المميزين', fields: [{name: 'الاسم', type: 'text'}, {name: 'الحالة', type: 'select', options: ['نشط', 'غير نشط']}], records: [] }
            ],
            notes: [
                { id: '1', title: 'نص ترحيبي', content: 'أهلاً بك في منصتنا، كيف يمكنني مساعدتك اليوم؟' }
            ]
        };

        let appData = defaultState;
        let currentUser = null; 

        // إتاحة الدوال على المستوى العام (لتعمل مع أزرار HTML مباشرة بعد تحويل السكربت لـ Module)
        window.loginWithGoogle = loginWithGoogle;
        window.loginForm = loginForm;
        window.logout = logout;
        window.navigate = navigate;
        window.closeModal = closeModal;
        window.openExtractionModal = openExtractionModal;
        window.confirmExtraction = confirmExtraction;
        window.copyToClipboard = copyToClipboard;
        window.openAddNetworkModal = openAddNetworkModal;
        window.addNetwork = addNetwork;
        window.deleteNetwork = deleteNetwork;
        window.doDeleteNetwork = doDeleteNetwork;
        window.openImportModal = openImportModal;
        window.processImport = processImport;
        window.openAddDenominationModal = openAddDenominationModal;
        window.addDenomination = addDenomination;
        window.addSingleCard = addSingleCard;
        window.deleteCard = deleteCard;
        window.openAddPromptModal = openAddPromptModal;
        window.addPrompt = addPrompt;
        window.updatePrompt = updatePrompt;
        window.deletePrompt = deletePrompt;
        window.runAi = runAi;
        window.openAddFeatureModal = openAddFeatureModal;
        window.addFeature = addFeature;
        window.deleteFeature = deleteFeature;
        window.addRecord = addRecord;
        window.openAddNoteModal = openAddNoteModal;
        window.addNote = addNote;
        window.updateNote = updateNote;
        window.deleteNote = deleteNote;
        window.saveSettings = saveSettings;

        // نظام المصادقة والمزامنة السحابية (Realtime Sync)
        onAuthStateChanged(auth, (user) => {
            if (user && !user.isAnonymous) {
                dbUser = user;
                currentUser = user.email || user.displayName || 'مستخدم Google';
                setupRealtimeSync();
                navigate('userHome');
            } else {
                dbUser = null;
                currentUser = null;
                navigate('login');
            }
        });

        async function initAuth() {
            if (!auth.currentUser) {
                try {
                    if (typeof __initial_auth_token !== 'undefined') {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch(e) { console.error("Auth Init Error:", e); }
            }
        }
        initAuth();

        let unsubscribeSnapshot = null;

        function setupRealtimeSync() {
            if (!dbUser) return;
            if (unsubscribeSnapshot) unsubscribeSnapshot();
            
            const docRef = doc(db, 'artifacts', appId, 'users', dbUser.uid, 'appData', 'state');
            unsubscribeSnapshot = onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    appData = snapshot.data();
                    updateGlobalUI();
                    if(currentView !== 'login') navigate(currentView, currentParams, true);
                } else {
                    saveData(); // حفظ البيانات الافتراضية لأول مرة
                }
            }, (error) => {
                console.error("Firestore Listen Failed:", error);
            });
        }
        
        async function saveData() {
            updateGlobalUI();
            if (!dbUser) return;
            try {
                await setDoc(doc(db, 'artifacts', appId, 'users', dbUser.uid, 'appData', 'state'), appData);
            } catch (e) {
                console.error(e);
                showToast('خطأ في حفظ البيانات', 'error');
            }
        }

        function updateGlobalUI() {
            document.getElementById('nav-site-name').innerText = appData.settings.siteName;
            document.getElementById('footer-site-name').innerText = appData.settings.siteName;
            document.title = appData.settings.siteName;
        }

        // --- Core Functions ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgColor = type === 'success' ? 'bg-emerald-500' : (type === 'error' ? 'bg-red-500' : 'bg-blue-500');
            let icon = type === 'success' ? 'fa-check-circle' : (type === 'error' ? 'fa-circle-exclamation' : 'fa-info-circle');

            toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 transform transition-all duration-300 translate-y-10 opacity-0`;
            toast.innerHTML = `
                <i class="fa-solid ${icon}"></i>
                <span class="font-medium text-sm">${message}</span>
            `;
            
            container.appendChild(toast);
            
            // Animate in
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            });

            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function openModal(title, bodyHTML, footerHTML = '') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = bodyHTML;
            
            const footer = document.getElementById('modal-footer');
            if (footerHTML) {
                footer.innerHTML = footerHTML;
                footer.classList.remove('hidden');
            } else {
                footer.classList.add('hidden');
            }

            const backdrop = document.getElementById('modal-backdrop');
            const content = document.getElementById('modal-content');
            backdrop.classList.remove('hidden');
            
            // small delay for transition
            requestAnimationFrame(() => {
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            });
        }

        function closeModal() {
            const backdrop = document.getElementById('modal-backdrop');
            const content = document.getElementById('modal-content');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            
            setTimeout(() => {
                backdrop.classList.add('hidden');
            }, 200);
        }

        function copyToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('تم النسخ بنجاح');
            } catch (err) {
                showToast('فشل النسخ', 'error');
            }
            document.body.removeChild(textArea);
        }

        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        // --- Navigation & Rendering ---
        const contentArea = document.getElementById('app-content');
        const navbar = document.getElementById('navbar');

        function navigate(view, params = {}, isRefresh = false) {
            currentView = view;
            currentParams = params;
            
            contentArea.innerHTML = '';
            if(!isRefresh) closeModal();
            updateGlobalUI();

            if (view === 'login') {
                navbar.classList.add('hidden');
                renderLogin();
                return;
            }

            if (!currentUser) {
                navigate('login');
                return;
            }

            navbar.classList.remove('hidden');
            document.getElementById('nav-user-email').innerText = currentUser;

            switch(view) {
                case 'userHome': renderUserHome(); break;
                case 'userNetworks': renderUserNetworks(); break;
                case 'userNetworkDetail': renderUserNetworkDetail(params.id); break;
                case 'userMyCards': renderUserMyCards(); break;
                case 'userPrompts': renderUserPrompts(); break;
                case 'userPromptDetail': renderUserPromptDetail(params.id); break;
                case 'userCustomFeatures': renderUserCustomFeatures(); break;
                case 'userFeatureDetail': renderUserFeatureDetail(params.id); break;
                case 'userNotes': renderUserNotes(); break;
                
                case 'adminHome': renderAdminHome(); break;
                case 'adminNetworks': renderAdminNetworks(); break;
                case 'adminNetworkDetail': renderAdminNetworkDetail(params.id); break;
                case 'adminPrompts': renderAdminPrompts(); break;
                case 'adminCustomFeatures': renderAdminCustomFeatures(); break;
                case 'adminNotes': renderAdminNotes(); break;
                case 'adminSettings': renderAdminSettings(); break;
                default: renderUserHome();
            }
        }

        async function loginWithGoogle(event) {
            if(event) event.preventDefault();
            try {
                await signInWithPopup(auth, provider);
                showToast('تم تسجيل الدخول بنجاح');
            } catch (error) {
                showToast('فشل تسجيل الدخول: ' + error.message, 'error');
            }
        }

        function loginForm(event) {
            event.preventDefault();
            showToast('الرجاء استخدام "تسجيل الدخول بجوجل" لضمان حفظ البيانات السحابي', 'info');
        }

        async function logout() {
            try {
                await signOut(auth);
                showToast('تم تسجيل الخروج');
            } catch(e) {
                console.error(e);
            }
        }

        // --- Views: Authentication ---
        function renderLogin() {
            contentArea.innerHTML = `
                <div class="flex-grow flex items-center justify-center p-4">
                    <div class="glass-card w-full max-w-md rounded-2xl p-8 shadow-xl">
                        <div class="text-center mb-8">
                            <div class="w-16 h-16 bg-brand-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i class="fa-solid fa-layer-group text-3xl text-brand-600"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-gray-900">Welcome back</h2>
                            <p class="text-gray-500 mt-2">قم بتسجيل الدخول للمتابعة</p>
                        </div>
                        
                        <button type="button" onclick="loginWithGoogle(event)" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-xl px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors mb-6 shadow-sm hover:shadow">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" class="w-5 h-5">
                            Continue with Google
                        </button>
                        
                        <div class="relative flex items-center justify-center mb-6">
                            <div class="border-t border-gray-200 w-full absolute"></div>
                            <span class="bg-white px-4 text-xs text-gray-400 font-semibold uppercase relative z-10">OR</span>
                        </div>

                        <form onsubmit="loginForm(event)" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">البريد الإلكتروني</label>
                                <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all" placeholder="name@example.com">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">كلمة المرور</label>
                                <input type="password" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all" placeholder="••••••••">
                            </div>
                            <div class="flex justify-between items-center">
                                <a href="#" class="text-xs text-brand-600 hover:text-brand-500 font-medium">نسيت كلمة المرور؟</a>
                            </div>
                            <button type="submit" class="w-full bg-brand-500 text-white rounded-xl px-4 py-3 font-semibold hover:bg-brand-600 focus:ring-4 focus:ring-brand-100 transition-all">
                                Log in
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        // --- Shared Components ---
        function renderCardButton(icon, title, desc, onClick) {
            return `
                <div onclick="${onClick}" class="glass-card p-6 rounded-2xl cursor-pointer hover:shadow-lg hover:-translate-y-1 transition-all duration-300 group border border-gray-100">
                    <div class="w-12 h-12 bg-brand-50 rounded-xl flex items-center justify-center mb-4 group-hover:bg-brand-100 transition-colors">
                        <i class="${icon} text-2xl text-brand-600"></i>
                    </div>
                    <h3 class="text-xl font-bold text-gray-900 mb-2">${title}</h3>
                    <p class="text-gray-500 text-sm leading-relaxed">${desc}</p>
                </div>
            `;
        }

        // --- Views: User ---
        function renderUserHome() {
            contentArea.innerHTML = `
                <div class="mb-8">
                    <h1 class="text-3xl font-bold text-gray-900">مرحباً بعودتك! 👋</h1>
                    <p class="text-gray-500 mt-2">اختر الخدمة التي تريد استخدامها من القائمة أدناه.</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${renderCardButton('fa-solid fa-wifi', 'كروت الشحن', 'استخراج وبيع كروت الإنترنت والشبكات', "navigate('userNetworks')")}
                    ${renderCardButton('fa-solid fa-wallet', 'كروتي', 'سجل الكروت التي قمت باستخراجها مؤخراً', "navigate('userMyCards')")}
                    ${renderCardButton('fa-solid fa-wand-magic-sparkles', 'البرومبتات', 'قوالب الذكاء الاصطناعي الجاهزة للنسخ والاستخدام', "navigate('userPrompts')")}
                    ${renderCardButton('fa-solid fa-table-list', 'ميزات مخصصة', 'الوصول للسجلات وقواعد البيانات المخصصة', "navigate('userCustomFeatures')")}
                    ${renderCardButton('fa-regular fa-note-sticky', 'الملاحظات', 'النصوص المحفوظة، الـ Hooks والرسائل الجاهزة', "navigate('userNotes')")}
                </div>
            `;
        }

        function renderUserNetworks() {
            let html = `
                <div class="flex items-center gap-4 mb-8">
                    <button onclick="navigate('userHome')" class="text-gray-500 hover:text-brand-600 transition-colors"><i class="fa-solid fa-arrow-right text-xl"></i></button>
                    <h1 class="text-3xl font-bold text-gray-900">استخراج كروت الشحن</h1>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            `;
            
            if(appData.networks.length === 0) {
                html += `<div class="col-span-full text-center py-12 text-gray-400">لا توجد شبكات مضافة حالياً.</div>`;
            } else {
                appData.networks.forEach(net => {
                    html += `
                        <div onclick="navigate('userNetworkDetail', {id: '${net.id}'})" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 cursor-pointer hover:shadow-md hover:border-brand-300 transition-all text-center flex flex-col items-center justify-center min-h-[140px]">
                            <div class="text-4xl mb-3">${net.icon}</div>
                            <h3 class="font-semibold text-gray-800">${net.name}</h3>
                        </div>
                    `;
                });
            }
            html += `</div>`;
            contentArea.innerHTML = html;
        }

        function renderUserNetworkDetail(networkId) {
            const net = appData.networks.find(n => n.id === networkId);
            if(!net) return navigate('userNetworks');

            let html = `
                <div class="flex items-center gap-4 mb-8">
                    <button onclick="navigate('userNetworks')" class="text-gray-500 hover:text-brand-600 transition-colors"><i class="fa-solid fa-arrow-right text-xl"></i></button>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900 flex items-center gap-2">${net.icon} ${net.name}</h1>
                        ${net.notes ? `<p class="text-sm text-gray-500 mt-1">${net.notes}</p>` : ''}
                    </div>
                </div>
                
                <h2 class="text-lg font-bold text-gray-700 mb-4">فئات الأسعار المتاحة:</h2>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 mb-10">
            `;

            net.denominations.sort((a,b) => a.price - b.price).forEach((den, idx) => {
                const count = den.available.length;
                html += `
                    <div onclick="openExtractionModal('${net.id}', ${idx})" class="bg-white p-4 rounded-xl border-2 ${count > 0 ? 'border-gray-200 hover:border-brand-500 cursor-pointer' : 'border-gray-100 opacity-50 cursor-not-allowed'} transition-colors relative overflow-hidden group">
                        ${count > 0 ? `<div class="absolute top-0 right-0 w-16 h-16 bg-brand-50 rounded-bl-full -z-10 group-hover:bg-brand-100 transition-colors"></div>` : ''}
                        <div class="text-2xl font-black text-gray-900 mb-1">${den.price} <span class="text-sm font-medium text-gray-500">ج.م</span></div>
                        <div class="text-sm ${count > 0 ? 'text-brand-600 font-semibold' : 'text-gray-400'}">${count} متاح</div>
                    </div>
                `;
            });

            html += `
                </div>
                
                <h2 class="text-lg font-bold text-gray-700 mb-4">الكروت المستخرجة (هذه الشبكة):</h2>
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm text-right">
                            <thead class="bg-gray-50 text-gray-600 border-b border-gray-200">
                                <tr>

        function confirmExtraction(networkId, denIndex) {
            const net = appData.networks.find(n => n.id === networkId);
            const den = net.denominations[denIndex];
            const note = document.getElementById('extract-note').value;
            
            if(den.available.length > 0) {
                const code = den.available.shift(); // take first
                const extractedCard = {
                    code: code,
                    note: note,
                    date: new Date().toISOString()
                };
                den.extracted.unshift(extractedCard); // add to top
                saveData();
                closeModal();
                showToast('تم استخراج الكارت بنجاح');

        function processImport(netId) {
            const jsonStr = document.getElementById('import-json').value;
            try {
                const data = JSON.parse(jsonStr);
                if(!Array.isArray(data)) throw new Error('يجب أن يكون JSON مصفوفة (Array)');
                
                const net = appData.networks.find(n => n.id === netId);
                let addedCount = 0;

                data.forEach(item => {
                    if(item.price && item.code) {
                        let den = net.denominations.find(d => d.price === item.price);
                        if(!den) {
                            den = { price: item.price, available: [], extracted: [] };
                            net.denominations.push(den);
                        }
                        den.available.push(String(item.code));
                        addedCount++;
                    }
                });

                saveData();
                closeModal();
                showToast(`تم استيراد ${addedCount} كارت بنجاح`);
                navigate('adminNetworkDetail', {id: netId});

            } catch (e) {

            }
        }

        async function runAi(promptId) {
            const inputEl = document.getElementById(`run-input-${promptId}`);
            const btnEl = document.getElementById(`run-btn-${promptId}`);
            const userInput = inputEl.value.trim();
            const prompt = appData.prompts.find(p => p.id === promptId);
            
            if(!userInput) return showToast('يرجى إدخال تفاصيل الطلب', 'error');

            const apiKey = appData.settings.geminiKey;
            const modelName = appData.settings.geminiModel || 'gemini-3.5-flash';
            
            btnEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري التوليد...`;
            btnEl.disabled = true;

            const fullPrompt = `${prompt.staticPrompt}\n\nالمعطيات/الطلب: ${userInput}`;
            let generatedText = "";

            if(apiKey) {
                // Actual API Call
                try {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
                    const payload = {
                        contents: [{ parts: [{ text: fullPrompt }] }]
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();
                    if(result.error) throw new Error(result.error.message);
                    
                    generatedText = result.candidates[0].content.parts[0].text;
                } catch(err) {
                    showToast('خطأ في API: ' + err.message, 'error');
                    btnEl.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> شغل الذكاء`;
                    btnEl.disabled = false;
                    return;
                }
            } else {
                // Mock API Call if no key
                await new Promise(r => setTimeout(r, 1500));
                generatedText = `[محاكاة ذكاء اصطناعي - يرجى إدخال مفتاح API حقيقي في الإعدادات]\n\nبناءً على طلبك ("${userInput}")، إليك الرد المقترح:\nهذا نص تجريبي يوضح كيف سيظهر رد الذكاء الاصطناعي على منصتك بصورة منسقة وجميلة.`;
            }

            prompt.generated.push({
                input: userInput,
                output: generatedText,
                date: new Date().toISOString()
            });
            saveData();
            
            inputEl.value = '';
            btnEl.innerHTML = `<i class="fa-solid fa-check"></i> تم التوليد`;
            setTimeout(() => {
                navigate('adminPrompts');
                // Open result modal to show it immediately
                openModal('نتيجة التوليد', `
                    <div class="whitespace-pre-wrap text-gray-800 bg-gray-50 p-4 rounded-lg border border-gray-200">${generatedText}</div>
                `, `
                    <button onclick="closeModal()" class="px-4 py-2 bg-gray-100 rounded-lg">إغلاق</button>
                    <button onclick="copyToClipboard(\`${generatedText.replace(/`/g, '\\`')}\`)" class="px-4 py-2 bg-brand-500 text-white rounded-lg">نسخ النص</button>
                `);
            }, 500);
        }

                        <label class="block text-sm font-medium text-gray-700 mb-1">النص / المحتوى</label>
                        <textarea id="note-content" class="w-full px-4 py-2 rounded-lg border border-gray-300 h-32"></textarea>
                    </div>
                </div>
            `, `
                <button onclick="closeModal()" class="px-4 py-2 text-gray-600 bg-gray-100 rounded-lg">إلغاء</button>
                <button onclick="addNote()" class="px-6 py-2 bg-brand-500 text-white rounded-lg">إضافة</button>
            `);
        }

        function addNote() {
            const title = document.getElementById('note-title').value;
            const content = document.getElementById('note-content').value;
            if(!title || !content) return;
            appData.notes.push({ id: generateId(), title, content });
            saveData();
            closeModal();
            navigate('adminNotes');
        }

        function updateNote(id) {
            const note = appData.notes.find(n => n.id === id);
            note.content = document.getElementById(`edit-note-${id}`).value;
            saveData();
            showToast('تم حفظ الملاحظة');
        }
        function deleteNote(id) {
            appData.notes = appData.notes.filter(n => n.id !== id);
            saveData();
            navigate('adminNotes');
        }

        // Admin: Settings
        function renderAdminSettings() {
            let html = `
                <div class="flex items-center gap-4 mb-8">
                    <button onclick="navigate('adminHome')" class="text-gray-500 hover:text-brand-600 transition-colors"><i class="fa-solid fa-arrow-right text-xl"></i></button>
                    <h1 class="text-2xl font-bold text-gray-900">إعدادات النظام</h1>
                </div>
                
                <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 max-w-2xl">
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">اسم الموقع / المنصة</label>
                            <input type="text" id="set-sitename" value="${appData.settings.siteName}" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all">
                        </div>
                        
                        <div class="border-t border-gray-100 pt-6">
                            <h3 class="text-lg font-bold text-gray-900 mb-4 flex items-center gap-2"><i class="fa-solid fa-robot text-brand-500"></i> إعدادات الذكاء الاصطناعي (Gemini API)</h3>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">مفتاح الـ API (Gemini API Key)</label>
                                    <input type="password" id="set-apikye" value="${appData.settings.geminiKey}" placeholder="AIzaSy..." class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all font-mono">
                                    <p class="text-xs text-gray-500 mt-1">يُحفظ المفتاح محلياً في متصفحك فقط ولا يُرسل لأي سيرفر وسيط.</p>
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-gray-700 mb-2">نموذج الذكاء الاصطناعي (Model)</label>
                                    <select id="set-model" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition-all bg-white">
                                        <option value="gemini-3.5-flash" ${appData.settings.geminiModel === 'gemini-3.5-flash' ? 'selected' : ''}>gemini-3.5-flash (أسرع - موصى به)</option>
                                        <option value="gemini-2.5-pro" ${appData.settings.geminiModel === 'gemini-2.5-pro' ? 'selected' : ''}>gemini-2.5-pro (أكثر دقة)</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="pt-4 flex justify-end">
                            <button onclick="saveSettings()" class="bg-brand-500 text-white px-8 py-3 rounded-xl font-bold hover:bg-brand-600 transition-colors shadow-md shadow-brand-500/30 flex items-center gap-2">
                                <i class="fa-regular fa-floppy-disk"></i> حفظ الإعدادات
                            </button>
                        </div>
                    </div>
                </div>
            `;
            contentArea.innerHTML = html;
        }

        function saveSettings() {
            appData.settings.siteName = document.getElementById('set-sitename').value || 'المنصة';
            appData.settings.geminiKey = document.getElementById('set-apikye').value;
            appData.settings.geminiModel = document.getElementById('set-model').value;
            saveData();
            showToast('تم حفظ الإعدادات بنجاح');
        }

    </script>
</body>
</html>
